<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuminSDK — animação de abertura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/reveal.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #07070c; color: #e9d5ff;
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    .card { width: min(560px, 100%); background: rgba(20, 14, 34, .82);
      border: 1px solid rgba(196, 181, 253, .22); border-radius: 22px; padding: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
    h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -.02em; }
    p { color: #a9a0c8; font-size: .9rem; line-height: 1.6; margin: 0 0 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    button { cursor: pointer; border: 1px solid rgba(196, 181, 253, .35);
      background: linear-gradient(180deg, rgba(139, 92, 246, .28), rgba(124, 58, 237, .12));
      color: #f3e8ff; font: inherit; font-size: .85rem; font-weight: 600;
      padding: 11px 16px; border-radius: 12px; transition: transform .15s ease, border-color .15s ease; }
    button:hover { transform: translateY(-1px); border-color: rgba(196, 181, 253, .7); }
    button.ghost { background: rgba(255, 255, 255, .04); }
    code { background: rgba(255, 255, 255, .07); padding: 2px 6px; border-radius: 6px; font-size: .82rem; }
    .hint { margin: 0; color: #7c769a; font-size: .78rem; }
    .frame { position: relative; margin-top: 18px; height: 190px; border-radius: 16px;
      border: 1px dashed rgba(196, 181, 253, .25); overflow: hidden; display: grid; place-items: center; }
    .frame .who { position: absolute; inset: auto 12px 10px auto; font-size: .7rem;
      letter-spacing: .16em; text-transform: uppercase; color: #6f6a8c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Abertura do LuminSDK</h1>
      <p>Mesma animação que toca quando <code>Shift + D</code> abre o catálogo. Ela aparece
        por cima da página, dura ~2,4 s e pode ser pulada com clique ou qualquer tecla.</p>

      <div class="row">
        <button id="lumin">Abrir o catálogo (LuminSDK)</button>
        <button id="estudo" class="ghost">Voltar aos estudos (StudyHub)</button>
      </div>
      <div class="row">
        <button id="blast" class="ghost">Sortear outro (ignora o intervalo)</button>
        <button id="state" class="ghost">Ver estado</button>
        <button id="cfg" class="ghost">Ver/config</button>
      </div>
      <p class="hint" id="hint">—</p>

      <div class="frame">
        <span style="color:#6f6a8c;font-size:.8rem">conteúdo do site atrás da animação</span>
        <span class="who" id="who">portal de estudos</span>
      </div>
    </div>
  </div>

  <script src="../../assets/js/reveal.js"></script>
  <script>
    const who = document.getElementById('who');
    const hint = document.getElementById('hint');
    function run(route) {
      who.textContent = route === 'lumin' ? 'catálogo de jogos' : 'portal de estudos';
      const ok = window.LuminReveal.show(route, 'roll');
      hint.textContent = ok ? 'tocando: ' + route : 'bloqueado pelo intervalo de 10 s (use "Sortear outro")';
    }
    document.getElementById('lumin').addEventListener('click', () => run('lumin'));
    document.getElementById('estudo').addEventListener('click', () => run('estudo'));
    document.getElementById('blast').addEventListener('click', () => {
      who.textContent = 'catálogo de jogos';
      hint.textContent = 'tocando (blast): ' + window.LuminReveal.blast('lumin');
    });
    document.getElementById('state').addEventListener('click', () => {
      hint.textContent = JSON.stringify(window.LuminReveal.state());
    });
    /* EDITE AQUI: window.LuminReveal.config — duração, cooldown, cores, textos
       e raridades. Ex.: LuminReveal.config.DURATION = 4000; depois clique em
       "Abrir o catálogo". */
    document.getElementById('cfg').addEventListener('click', () => {
      const c = window.LuminReveal.config;
      c.DURATION = c.DURATION === 2400 ? 4000 : 2400;
      hint.textContent = 'DURATION agora é ' + c.DURATION + ' ms · COOLDOWN ' + c.COOLDOWN +
        ' ms · SPARKS ' + c.SPARKS;
    });
    document.getElementById('blast').click();
  </script>
</body>
</html>
